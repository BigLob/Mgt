<title>Archenemy Table</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Figtree:wght@400;500;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column, game table top to bottom: life, poison, scheme stage, ongoing, log. Single dark look by choice. */
:root {
  --bg: #120e15;
  --surface: #1d1722;
  --surface-2: #271f2e;
  --line: #3a2f42;
  --fg: #f1e9f3;
  --muted: #a99bb0;
  --accent: #cfa64e;      /* tarnished gold: archenemy */
  --accent-ink: #1a1306;
  --hero: #6fb3dc;        /* hero team */
  --poison: #86cc63;
  --danger: #e5584f;
  --font-display: "Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--accent); }
h2 { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-height: 44px; }
button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn-quiet { background: transparent; }
a { color: var(--hero); }
section { display: flex; flex-direction: column; gap: 10px; }

/* Header */
.top { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.ok { color: var(--poison); border-color: color-mix(in srgb, var(--poison) 50%, transparent); }
.pill.warn { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }

/* Setup */
.players { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.players label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.players label.ae { grid-column: 1 / -1; }
.players input, .search { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 44px; width: 100%; min-width: 0; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button { font-size: 14px; padding: 8px 12px; }
.dealer { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.dealer h3, h3.mini { margin: 0; font-size: 13px; font-weight: 700; }
.set-toggle span { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.set-toggle[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface-2)); }
.set-toggle[aria-pressed="true"]::before { content: "✓ "; color: var(--accent); }
.set-group { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.set-group > h3 { margin: 0; padding: 10px 12px; background: var(--surface); font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.set-group > h3 span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.scheme-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); min-height: 48px; cursor: pointer; }
.scheme-row input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.scheme-row .nm { flex: 1; min-width: 0; }
.scheme-row.on { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tag { font-size: 11px; color: var(--danger); display: block; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.bar .in > p { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
.bar button { min-width: 140px; }

/* Life */
.life { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.side.ae { border-top: 3px solid var(--accent); }
.side.heroes { border-top: 3px solid var(--hero); }
.side .who { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side .num { font-family: var(--font-num); font-weight: 700; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.side.ae .num { color: var(--accent); }
.side.heroes .num { color: var(--hero); }
.side .num.low { color: var(--danger); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps button { padding: 6px 0; min-height: 44px; font-family: var(--font-num); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Poison */
.poison { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.pz .who { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pz .n { font-family: var(--font-num); font-size: 30px; font-weight: 700; line-height: 1; color: var(--poison); font-variant-numeric: tabular-nums; }
.pz .pm { display: flex; gap: 4px; width: 100%; }
.pz .pm button { flex: 1; padding: 0; min-height: 40px; }
.pz.out { opacity: .55; }
.pz.out .n { color: var(--danger); }

/* Scheme stage */
.stage { display: flex; flex-direction: column; gap: 10px; }
.motion { min-height: 96px; font-family: var(--font-display); font-weight: 700; font-size: 32px; letter-spacing: .01em; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scheme-card {
  position: relative; border-radius: 14px; padding: 22px 18px 18px; display: flex; flex-direction: column; gap: 14px;
  background: radial-gradient(120% 90% at 50% 0%, #3b2a45 0%, var(--surface) 70%);
  border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--line));
  box-shadow: inset 0 0 0 4px var(--bg), inset 0 0 0 5px color-mix(in srgb, var(--accent) 35%, transparent);
}
.scheme-card .type { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.scheme-card .name { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; text-wrap: balance; }
.scheme-card .warn { font-size: 13px; color: var(--danger); }
.scheme-card .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.reveal { animation: reveal .5s ease-out; }
@keyframes reveal { from { transform: translateY(8px) scale(.98); opacity: .2; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
.ongoing { display: flex; flex-direction: column; gap: 8px; }
.og { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 8px 8px 12px; }
.og .nm { flex: 1; min-width: 0; font-family: var(--font-display); font-size: 20px; line-height: 1.1; }
.og .nm a { color: var(--fg); text-decoration: none; }
.og button { flex: none; font-size: 13px; }
.empty { color: var(--muted); font-size: 13px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }

/* Banner, log, tools */
.banner { border-radius: var(--r); padding: 14px; font-weight: 700; text-align: center; font-size: 17px; }
.banner.heroes { background: color-mix(in srgb, var(--hero) 18%, var(--surface)); color: var(--hero); border: 1px solid var(--hero); }
.banner.ae { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--accent); border: 1px solid var(--accent); }
details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
summary { padding: 12px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.log li { display: flex; gap: 10px; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tools button { flex: 1; min-width: 120px; }
.danger-armed { background: var(--danger); border-color: var(--danger); color: #1a0505; font-weight: 700; }
.note { font-size: 12px; color: var(--muted); }
</style>

<div class="wrap" id="app"></div>

<script>
(() => {
  // Scheme list from knowledge-base/archenemy-scheme-checklist.md (102 distinct names).
  const SETS = [
    ["Archenemy (2010)", ["All in Good Time","All Shall Smolder in My Wake","Approach My Molten Realm","Behold the Power of Destruction","Choose Your Champion","Dance, Pathetic Marionette","The Dead Shall Serve","A Display of My Dark Power","Embrace My Diabolical Vision","Every Hope Shall Vanish","Every Last Vestige Shall Rot","Evil Comes to Fruition","The Fate of the Flammable","Feed the Machine","I Bask in Your Silent Awe","I Call on the Ancient Magics","I Delight in Your Convulsions","I Know All, I See All","Ignite the Cloneforge!","Into the Earthen Maw","Introductions Are in Order","The Iron Guardian Stirs","Know Naught but Fire","Look Skyward and Despair","May Civilization Collapse","Mortal Flesh Is Weak","My Crushing Masterstroke","My Genius Knows No Bounds","My Undead Horde Awakens","My Wish Is Your Command","Nature Demands an Offering","Nature Shields Its Own","Nothing Can Stop Me Now","Only Blood Ends Your Nightmares","The Pieces Are Coming Together","Realms Befitting My Majesty","Roots of All Evil","Rotted Ones, Lay Siege","Surrender Your Thoughts","Tooth, Claw, and Tail","The Very Soil Shall Shake","Which of You Burns Brightest?","Your Fate Is Thrice Sealed","Your Puny Minds Cannot Fathom","Your Will Is Not Your Own"]],
    ["Promos", ["Plots That Span Centuries","Perhaps You've Met My Cohort","Your Inescapable Doom","Drench the Soil in Their Blood","Imprison This Insolent Wretch"]],
    ["Archenemy: Nicol Bolas (2017)", ["The Mighty Will Fall","Bow to My Command","Know Evil","When Will You Learn?","Choose Your Demise","Delight in the Hunt","Because I Have Willed It","Power Without Equal","There Is No Refuge","My Forces Are Innumerable","Make Yourself Useful","Pay Tribute to Me","This World Belongs to Me","For Each of You, a Gift","Behold My Grandeur","What's Yours Is Now Mine","Every Dream a Nightmare","No One Will Hear Your Cries","My Laughter Echoes","A Reckoning Approaches"]],
    ["Duskmourn Commander (2024)", ["I Am Untouchable","Mine Is the Only Truth","Your Own Face Mocks You","Kneel Before My Legions","You Are Unworthy of Mercy","Chaos Is My Plaything","Your Plans Mean Nothing","You Will Know True Suffering","My Tendrils Run Deep","Dark Wings Bring Your Downfall","I Am Never Alone","Rot Like the Scum You Are","You Live Only Because I Will It","My Will Is Irresistible","My Wings Enfold All","Your Mistake Is My Triumph","Fear My Authority","Reality Is Mine to Control","Running Is Useless","You Exist Only to Amuse","I Call for Slaughter","I Will Savor Your Agony","Your Nightmares Are Delicious","No Secret Is Hidden from Me","You Cannot Hide from Me","My Champion Stands Supreme","Only I Know What Awaits","My Followers Ascend","Time Bends to My Will","I Am Duskmourn","My Wealth Will Bury You","A Premonition of Your Demise"]],
  ];
  const PRESETS = {
    "Jump Scare": ["My Laughter Echoes","Power Without Equal","I Am Untouchable","Mine Is the Only Truth","Your Own Face Mocks You","Kneel Before My Legions","You Are Unworthy of Mercy","Chaos Is My Plaything","Your Plans Mean Nothing","You Will Know True Suffering"],
    "Death Toll": ["Choose Your Champion","Plots That Span Centuries","My Tendrils Run Deep","Dark Wings Bring Your Downfall","I Am Never Alone","Rot Like the Scum You Are","You Live Only Because I Will It","My Will Is Irresistible","My Wings Enfold All","Your Mistake Is My Triumph"],
    "Endless Punishment": ["When Will You Learn?","My Crushing Masterstroke","Fear My Authority","Reality Is Mine to Control","Running Is Useless","You Exist Only to Amuse","I Call for Slaughter","I Will Savor Your Agony","Your Nightmares Are Delicious","No Secret Is Hidden from Me"],
    "Miracle Worker": ["Choose Your Demise","Behold the Power of Destruction","You Cannot Hide from Me","My Champion Stands Supreme","Only I Know What Awaits","My Followers Ascend","Time Bends to My Will","I Am Duskmourn","My Wealth Will Bury You","A Premonition of Your Demise"],
  };
  // Schemes Wizards flags as broken with a shared hero life total.
  const SHARED_LIFE_WARN = new Set(["Mortal Flesh Is Weak"]);
  const MIN_DECK = 10, DEAL = 20, START_LIFE = 60, POISON_OUT = 10, KEY = "archenemy-table-v1";
  // Everything printed in each set, reprints included (Duskmourn's 40 = its four preset decks).
  const SET_POOLS = Object.fromEntries(SETS.map(([t, names]) => [t, t.startsWith("Duskmourn") ? [...new Set([...names, ...Object.values(PRESETS).flat()])] : names]));
  const poolFor = sets => [...new Set(sets.flatMap(t => SET_POOLS[t] || []))].filter(n => !SHARED_LIFE_WARN.has(n));

  const scry = n => "https://scryfall.com/search?q=" + encodeURIComponent('!"' + n + '" t:scheme');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shuffle = a => {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const r = new Uint32Array(1); crypto.getRandomValues(r);
      const j = r[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const now = () => new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

  const fresh = () => ({
    phase: "setup", selected: PRESETS["Jump Scare"].slice(), filter: "", sets: SETS.map(s => s[0]),
    names: { ae: "Archenemy", h: ["Hero 1", "Hero 2", "Hero 3"] },
    game: null, undo: [],
  });
  let S = fresh();

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.phase) return v; } catch (e) {} return null; };

  // Mutations ---------------------------------------------------------------
  const snap = () => { S.undo.push(JSON.stringify(S.game)); if (S.undo.length > 40) S.undo.shift(); };
  const log = (text, key) => {
    const L = S.game.log, last = L[0], t = Date.now();
    if (key && last && last.key === key && t - last.at < 5000) { last.text = text; last.at = t; return; }
    L.unshift({ text, key, at: t, time: now() });
  };

  function startGame() {
    S.game = {
      deck: shuffle(S.selected), current: null, ongoing: [], turn: 0,
      aeLife: START_LIFE, heroLife: START_LIFE, poison: { ae: 0, h: [0, 0, 0] }, log: [],
    };
    S.undo = [];
    S.phase = "game";
    log("Game started with " + S.selected.length + " schemes, shuffled.");
    wake();
  }
  function setInMotion() {
    const g = S.game; if (g.current || !g.deck.length) return;
    snap();
    g.current = g.deck.shift(); g.turn++;
    log("Turn " + g.turn + ": set in motion " + g.current + ".");
  }
  function resolve(ongoing) {
    const g = S.game; if (!g.current) return;
    snap();
    if (ongoing) { g.ongoing.push(g.current); log(g.current + " stays in play (ongoing)."); }
    else { g.deck.push(g.current); log(g.current + " went to the bottom of the scheme deck."); }
    g.current = null;
  }
  function abandon(i) {
    const g = S.game, n = g.ongoing[i]; if (n == null) return;
    snap();
    g.ongoing.splice(i, 1); g.deck.push(n);
    log("Abandoned " + n + ". It went to the bottom.");
  }
  function life(side, d) {
    const g = S.game, k = side === "ae" ? "aeLife" : "heroLife";
    // Rapid taps on one side count as a single change: one log line, one undo step.
    const burst = g._lifeFrom && g._lifeFrom.side === side && Date.now() - g._lifeFrom.at < 5000;
    if (!burst) snap();
    const before = burst ? g._lifeFrom.v : g[k];
    g[k] += d;
    g._lifeFrom = { side, v: before, at: Date.now() };
    const who = side === "ae" ? S.names.ae : "Heroes";
    log(who + " life " + before + " → " + g[k] + ".", "life-" + side);
  }
  function poison(who, d) {
    const g = S.game;
    const cur = who === "ae" ? g.poison.ae : g.poison.h[who];
    const v = Math.max(0, cur + d); if (v === cur) return;
    snap();
    if (who === "ae") g.poison.ae = v; else g.poison.h[who] = v;
    const name = who === "ae" ? S.names.ae : S.names.h[who];
    log(name + " poison " + cur + " → " + v + (v >= POISON_OUT && cur < POISON_OUT ? ". Eliminated." : "."));
  }
  function undo() {
    const prev = S.undo.pop(); if (!prev) return;
    const keepLog = S.game.log;
    S.game = JSON.parse(prev);
    S.game.log = [{ text: "Undid last action.", at: Date.now(), time: now() }, ...keepLog];
  }

  function outcome() {
    const g = S.game; if (!g) return null;
    if (g.aeLife <= 0 || g.poison.ae >= POISON_OUT) return ["heroes", "The heroes win. " + S.names.ae + " is defeated."];
    if (g.heroLife <= 0) return ["ae", S.names.ae + " wins. The heroes' life total hit 0."];
    if (g.poison.h.every(p => p >= POISON_OUT)) return ["ae", S.names.ae + " wins. Every hero is out on poison."];
    return null;
  }

  let wakeLock = null;
  async function wake() { try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.phase === "game") wake(); });

  // Rendering ---------------------------------------------------------------
  const app = document.getElementById("app");

  function renderSetup() {
    const sel = new Set(S.selected), n = sel.size, ready = n >= MIN_DECK;
    const f = S.filter.trim().toLowerCase();
    const sets = new Set(S.sets || []), pool = poolFor([...sets]);
    const groups = SETS.map(([title, names]) => {
      const shown = names.filter(x => !f || x.toLowerCase().includes(f));
      if (!shown.length) return "";
      const picked = names.filter(x => sel.has(x)).length;
      return `<div class="set-group"><h3>${esc(title)}<span>${picked} / ${names.length}</span></h3>${shown.map(x => `
        <label class="scheme-row${sel.has(x) ? " on" : ""}">
          <input type="checkbox" id="pick-${esc(x).replace(/[^a-z0-9]/gi, "")}" data-pick="${esc(x)}"${sel.has(x) ? " checked" : ""}>
          <span class="nm">${esc(x)}${SHARED_LIFE_WARN.has(x) ? `<span class="tag">Breaks with the heroes' shared life total</span>` : ""}</span>
        </label>`).join("")}</div>`;
    }).join("");
    app.innerHTML = `
      <header class="top">
        <div><h1>Archenemy Table</h1><p class="sub">Commander · 1 archenemy vs 3 heroes</p></div>
      </header>
      <section>
        <h2>Players</h2>
        <div class="players">
          <label class="ae">Archenemy<input id="nm-ae" data-name="ae" value="${esc(S.names.ae)}" autocomplete="off"></label>
          ${S.names.h.map((h, i) => `<label>Hero ${i + 1}<input id="nm-h${i}" data-name="${i}" value="${esc(h)}" autocomplete="off"></label>`).join("")}
        </div>
      </section>
      <section>
        <h2>Scheme deck</h2>
        <p class="sub">10 or more schemes, no repeats. Deal a random deck from the sets you choose, start from a Duskmourn deck, or pick your own.</p>
        <div class="dealer">
          <h3>Random from sets</h3>
          <div class="presets">
            ${SETS.map(([t]) => `<button class="set-toggle" data-set="${esc(t)}" aria-pressed="${sets.has(t)}">${esc(t)} <span>${SET_POOLS[t].length}</span></button>`).join("")}
          </div>
          <button class="btn-primary" data-act="deal"${pool.length ? "" : " disabled"}>Deal ${Math.min(DEAL, pool.length)} random</button>
          <p class="note">${pool.length ? `Picks from ${pool.length} schemes in the chosen sets${pool.length < DEAL ? `. That's fewer than ${DEAL}, so you get all of them` : ""}.${sets.has("Archenemy (2010)") ? " Mortal Flesh Is Weak is left out." : ""}` : "Choose at least one set."}</p>
        </div>
        <h3 class="mini">Duskmourn Commander decks</h3>
        <div class="presets">
          ${Object.keys(PRESETS).map(p => `<button data-preset="${esc(p)}">${esc(p)}</button>`).join("")}
          <button data-preset="__clear" class="btn-quiet">Clear</button>
        </div>
        <input class="search" id="filter" type="search" placeholder="Filter schemes by name" value="${esc(S.filter)}" autocomplete="off">
        ${groups || `<p class="empty">No scheme matches “${esc(S.filter)}”.</p>`}
      </section>
      <div class="bar"><div class="in">
        <p><span class="pill ${ready ? "ok" : "warn"}">${n} scheme${n === 1 ? "" : "s"}</span> ${ready ? "Ready to play." : `Pick ${MIN_DECK - n} more.`}</p>
        <button class="btn-primary" data-act="start"${ready ? "" : " disabled"}>Start game</button>
      </div></div>`;
  }

  function renderGame() {
    const g = S.game, o = outcome();
    const lifeSide = (side, label, v) => `
      <div class="side ${side}">
        <div class="who">${esc(label)}</div>
        <div class="num${v <= 10 ? " low" : ""}">${v}</div>
        <div class="steps">
          <button data-life="${side}" data-d="-5" aria-label="${esc(label)} minus 5">−5</button>
          <button data-life="${side}" data-d="-1" aria-label="${esc(label)} minus 1">−1</button>
          <button data-life="${side}" data-d="1" aria-label="${esc(label)} plus 1">+1</button>
          <button data-life="${side}" data-d="5" aria-label="${esc(label)} plus 5">+5</button>
        </div>
      </div>`;
    const pz = (who, label, v) => `
      <div class="pz${v >= POISON_OUT ? " out" : ""}">
        <div class="who">${esc(label)}</div>
        <div class="n">${v}</div>
        <div class="pm"><button data-poison="${who}" data-d="-1" aria-label="${esc(label)} poison minus 1">−</button><button data-poison="${who}" data-d="1" aria-label="${esc(label)} poison plus 1">+</button></div>
      </div>`;
    const stage = g.current ? `
      <article class="scheme-card${justRevealed ? " reveal" : ""}">
        <div class="type">Scheme · set in motion · turn ${g.turn}</div>
        <div class="name">${esc(g.current)}</div>
        ${SHARED_LIFE_WARN.has(g.current) ? `<p class="warn">Wizards recommends skipping this one with a shared hero life total.</p>` : ""}
        <a href="${scry(g.current)}" target="_blank" rel="noopener">Read the card on Scryfall ↗</a>
        <div class="acts">
          <button data-act="done">Resolved: to bottom</button>
          <button class="btn-primary" data-act="ongoing">Ongoing: keep</button>
        </div>
      </article>` : g.deck.length ? `
      <button class="motion" data-act="motion">Set in Motion</button>
      <p class="note">Tap at the start of ${esc(S.names.ae)}'s precombat main phase.</p>`
      : `<p class="empty">The scheme deck is empty. Abandon an ongoing scheme to put it back.</p>`;
    app.innerHTML = `
      <header class="top">
        <div><h1>Archenemy Table</h1></div>
        <div class="meta"><span class="pill">Turn ${g.turn}</span><span class="pill">${g.deck.length} in deck</span><span class="pill">${g.ongoing.length} ongoing</span></div>
      </header>
      ${o ? `<div class="banner ${o[0]}">${esc(o[1])}</div>` : ""}
      <section>
        <h2>Life</h2>
        <div class="life">${lifeSide("ae", S.names.ae, g.aeLife)}${lifeSide("heroes", "Heroes (shared)", g.heroLife)}</div>
      </section>
      <section>
        <h2>Poison · 10 is out</h2>
        <div class="poison">${pz("ae", S.names.ae, g.poison.ae)}${S.names.h.map((h, i) => pz(i, h, g.poison.h[i])).join("")}</div>
      </section>
      <section class="stage">
        <h2>Scheme</h2>
        ${stage}
      </section>
      <section>
        <h2>Ongoing schemes</h2>
        <div class="ongoing">${g.ongoing.length ? g.ongoing.map((n, i) => `
          <div class="og"><div class="nm"><a href="${scry(n)}" target="_blank" rel="noopener">${esc(n)}</a></div><button data-abandon="${i}">Abandon</button></div>`).join("")
          : `<p class="empty">None in play.</p>`}</div>
      </section>
      <details id="log-box"${logOpen ? " open" : ""}>
        <summary>Game log (${g.log.length})</summary>
        <ul class="log">${g.log.map(l => `<li><time>${esc(l.time)}</time><span>${esc(l.text)}</span></li>`).join("")}</ul>
      </details>
      <div class="tools">
        <button data-act="undo"${S.undo.length ? "" : " disabled"}>Undo</button>
        <button data-act="end" class="${endArmed ? "danger-armed" : ""}">${endArmed ? "Tap again to end" : "End game"}</button>
      </div>`;
  }

  let justRevealed = false, endArmed = false, endTimer = null, logOpen = false;
  function render() {
    if (S.phase === "game" && S.game) renderGame(); else renderSetup();
    justRevealed = false;
    save();
  }

  // Events ------------------------------------------------------------------
  app.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const d = Number(b.dataset.d);
    if (b.dataset.preset) {
      const p = b.dataset.preset;
      if (p === "__clear") S.selected = [];
      else S.selected = PRESETS[p].slice();
      return render();
    }
    if (b.dataset.set) {
      const t = b.dataset.set, cur = new Set(S.sets || []);
      cur.has(t) ? cur.delete(t) : cur.add(t);
      S.sets = SETS.map(s => s[0]).filter(x => cur.has(x));
      return render();
    }
    if (b.dataset.act === "deal") { S.selected = shuffle(poolFor(S.sets || [])).slice(0, DEAL); return render(); }
    if (b.dataset.life) { life(b.dataset.life, d); return render(); }
    if (b.dataset.poison) { poison(b.dataset.poison === "ae" ? "ae" : Number(b.dataset.poison), d); return render(); }
    if (b.dataset.abandon != null) { abandon(Number(b.dataset.abandon)); return render(); }
    switch (b.dataset.act) {
      case "start": if (S.selected.length >= MIN_DECK) { startGame(); window.scrollTo(0, 0); } break;
      case "motion": setInMotion(); justRevealed = true; break;
      case "done": resolve(false); break;
      case "ongoing": resolve(true); break;
      case "undo": undo(); break;
      case "end":
        if (!endArmed) { endArmed = true; clearTimeout(endTimer); endTimer = setTimeout(() => { endArmed = false; render(); }, 3000); }
        else { endArmed = false; clearTimeout(endTimer); S.phase = "setup"; S.game = null; S.undo = []; try { wakeLock && wakeLock.release(); } catch (e) {} window.scrollTo(0, 0); }
        break;
      default: return;
    }
    render();
  });
  app.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.pick) {
      const n = t.dataset.pick;
      S.selected = t.checked ? [...new Set([...S.selected, n])] : S.selected.filter(x => x !== n);
      const y = window.scrollY; render(); window.scrollTo(0, y);
    }
  });
  app.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.name != null) {
      const v = t.value.slice(0, 24) || (t.dataset.name === "ae" ? "Archenemy" : "Hero " + (Number(t.dataset.name) + 1));
      if (t.dataset.name === "ae") S.names.ae = v; else S.names.h[Number(t.dataset.name)] = v;
      save();
    } else if (t.id === "filter") {
      S.filter = t.value; render();
      const el = document.getElementById("filter"); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    }
  });
  app.addEventListener("toggle", e => { if (e.target.id === "log-box") logOpen = e.target.open; }, true);

  // Boot --------------------------------------------------------------------
  window.claude?.hot?.snapshot?.(() => S);
  const start = data => { S = (data && data.phase ? data : null) || load() || fresh(); if (S.phase === "game") wake(); render(); };
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
